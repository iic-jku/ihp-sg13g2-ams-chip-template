#
# HV variant of config.yaml: uses the thick-oxide 3.3 V sg13g2_stdcell_hv
# library from IHP-Open-PDK PR #1103 (draft). The HV library currently ships
# only one liberty corner (typ, 3.30 V, 25 C), so STA runs on that corner only.

meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

    "+OpenROAD.DetailedRouting": "Odb.InsertECOBuffers"
    "+Odb.InsertECOBuffers": "OpenROAD.DetailedRouting"

INSERT_ECO_BUFFERS:
  # === East Pads ===
  # - target: output19/X # enable_i
  # buffer: sg13g2_hv_buf_4
  # === END OF ECO_BUFFERS ===

DESIGN_NAME: counter_top
VERILOG_FILES: ["dir::../../rtl/constants.sv",
"dir::../../rtl/counter.sv",
"dir::../../rtl/counter_top.sv"]

# Enable plugin for better SystemVerilog support
# USE_SLANG: True

# Slightly smaller file sizes
# PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Layout / Floorplan Rules
DIE_AREA: [0, 0, 200, 100]
PL_TARGET_DENSITY_PCT: 40
GRT_ALLOW_CONGESTION: true
RUN_MAGIC_DRC: true
RUN_CTS: true

# Valid values are AREA 0-3 and DELAY 0-4
# DELAY 4 = fastest, but largest area
# AREA 3 = slowest, but smallest area
SYNTH_STRATEGY: DELAY 4
# MAX_FANOUT_CONSTRAINT: 6
# RT_MAX_LAYER: Metal5
FP_PIN_ORDER_CFG: dir::pin_order.cfg
FP_PDN_MULTILAYER: false
FP_SIZING: absolute

# SDC files
PNR_SDC_FILE: dir::impl.sdc
SIGNOFF_SDC_FILE: dir::signoff.sdc

# Power / ground nets
VDD_NETS: ["VDD"]
GND_NETS: ["VSS"]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"

# Clock
CLOCK_PORT: clock_i
CLOCK_NET: clock_i
CLOCK_PERIOD: 20 # in ns == 50 MHz

# Define Standard Cells
STD_CELL_LIBRARY: sg13g2_stdcell_hv

# Draft-PR workaround: the only flip-flop with both liberty and layout views
# in sg13g2_stdcell_hv is the scan cell sg13g2_hv_sdfbbp_1, which dfflibmap
# cannot target. Map the internal FF cells onto it (scan/set pins tied off).
# SYNTH_EXTRA_MAPPING_FILE is not PDK-scoped, so it must be set here.
SYNTH_EXTRA_MAPPING_FILE: pdk_dir::libs.tech/librelane/sg13g2_stdcell_hv/sdfbbp_map.v

# Technology LIBs
# The HV library is characterized for a single corner so far
LIB:
  "*_typ_3p30V_25C":
    - pdk_dir::libs.ref/sg13g2_stdcell_hv/lib/sg13g2_stdcell_hv_typ_3p30V_25C.lib

# Corners
STA_CORNERS:
  - nom_typ_3p30V_25C

DEFAULT_CORNER: nom_typ_3p30V_25C

# Fix setup violations
# PL_RESIZER_SETUP_SLACK_MARGIN: 0.60
# GRT_RESIZER_SETUP_SLACK_MARGIN: 0.55

# Fix hold violations
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 100
