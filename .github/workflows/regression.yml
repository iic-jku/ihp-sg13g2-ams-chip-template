name: regression

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Run make regression
    runs-on: ubuntu-latest
    # The full end-to-end tool/flow regression (analog + digital macros and the
    # chip top-level LibreLane run) is long-running; give it ample headroom.
    timeout-minutes: 360
    container:
      # IIC-OSIC-TOOLS ships the complete toolchain the regression exercises
      # (xschem, ngspice, cace, magic, klayout, yosys, verilator, icarus,
      # cocotb, librelane, ...) together with the IHP SG13G2 PDK.
      image: hpretl/iic-osic-tools:latest
      options: --user root
    env:
      PDK: ihp-sg13g2
      PDK_ROOT: /foss/pdks
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The regression assembles the chip top-level, which needs the
          # git submodules (e.g. flow/artistic). `make init-submodules` also
          # runs inside the target, but fetch them up front as well.
          submodules: recursive

      - name: Restore IIC-OSIC-TOOLS PATH
        # GitHub Actions overrides $PATH for container jobs with the runner
        # host's PATH, dropping the image's tool directories. Re-add every
        # bin/ dir the image ships so the regression's tools are found again.
        run: |
          find /foss -maxdepth 6 \( -path /foss/pdks -o -path /foss/designs \) -prune \
            -o -type d -name bin -print 2>/dev/null | sort -u >> "$GITHUB_PATH"
          for d in /foss/bin /usr/local/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done

      - name: Show tool environment
        run: |
          echo "PDK=$PDK  PDK_ROOT=$PDK_ROOT"
          for tool in xschem ngspice cace magic klayout yosys verilator iverilog librelane; do
            echo "$tool -> $(command -v "$tool" || echo NOT FOUND)"
          done
          ls "$PDK_ROOT" || true

      - name: Run regression
        run: make regression

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: |
            **/runs/**
            **/flow/**/*.log
            **/*.log
            **/simulation_logs/**
          if-no-files-found: ignore
